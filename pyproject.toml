[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-integration-platform"
version = "0.1.0"
description = "Plataforma de Integracao de Dados IoT - Integracao de Dados II (PUC Minas)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "cassandra-driver>=3.29.1",
    "neo4j>=5.20.0",
    "pydantic>=2.7.0",
    "pymongo>=4.7.0",
    "python-dotenv>=1.0.1",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
